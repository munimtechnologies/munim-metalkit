name: Build iOS

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'nitro.json'
      - 'package*.json'
      - '*.podspec'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'example/**'
      - 'nitrogen/**'
      - 'src/**'
      - 'nitro.json'
      - 'package*.json'
      - '*.podspec'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.2/6.3, iOS 26 SDK: the Metal 4 probes and MetalFX compile in.
          - runner: macos-26
            xcode: '26.6'
          # Swift 6.4, iOS 27 SDK.
          - runner: xcode-27
            xcode: '27.0'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Expo prebuild
        run: npx expo prebuild --clean --platform ios --no-install
        working-directory: example
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/.cocoapods/repos
          key: ${{ runner.os }}-xcode${{ matrix.xcode }}-pods-${{ hashFiles('package-lock.json', '*.podspec') }}
      - name: Install Pods
        run: pod install
        working-directory: example/ios
      - name: Build iOS example (device SDK, Metal 4 probes compiled in)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace MunimMetalKitExample.xcworkspace \
            -scheme MunimMetalKitExample \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build
      - name: Build iOS example (Simulator SDK)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace MunimMetalKitExample.xcworkspace \
            -scheme MunimMetalKitExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build
