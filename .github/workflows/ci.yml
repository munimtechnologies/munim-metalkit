name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate Nitro bindings
        run: npm run codegen
      - name: Generated bindings are committed
        run: |
          git add --intent-to-add nitrogen src/specs
          git diff --exit-code -- nitrogen src/specs
      - name: Typecheck (library)
        run: npm run typecheck
      - name: Typecheck (example)
        run: npm run typecheck:example
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (bob)
        run: npx bob build
      - name: Validate Expo prebuild configuration
        run: npx expo config --type prebuild > /dev/null
        working-directory: example
      - name: Inspect npm package contents
        run: npm pack --dry-run
